<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>

      <div id="startScreen" class="panel">
        <h1>Voxel Sandbox</h1>
        <label>
          Seed
          <input id="seedInput" type="text" placeholder="e.g. dune-forest-01" />
        </label>
        <div class="row">
          <button id="newWorldBtn">New World</button>
          <button id="loadWorldBtn">Load World</button>
        </div>
        <div id="worldList" class="list"></div>
        <p class="hint">Click “New World” then click the canvas to lock mouse.</p>
      </div>

      <div id="hud">
        <div id="debug"></div>
        <div id="crosshair">+</div>
        <div id="health"></div>
        <div id="hotbar"></div>
      </div>

      <div id="inventory" class="panel hidden"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
